spring.application.name=wheelGo

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/wheelgo_db
spring.datasource.username=postgres
spring.datasource.password=123


# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/public
spring.flyway.schemas=public
spring.flyway.default-schema=public
app.tenants.migrate-on-startup=true

#Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path = /api-docs
app.swagger.dev-auth-bypass.enabled=true

#JWT
jwt.secret=this-is-a-very-long-secret-key-for-wheelgo-app-that-is-at-least-32-chars
jwt.expiration=86400000

# Uploads
app.upload-dir=uploads

# Ollama
app.ollama.driver-license.api-url=http://localhost:11434/api/chat
app.ollama.driver-license.model=granite3.2-vision

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

spring.application.name=wheelGo

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/wheelgo_db
spring.datasource.username=postgres
spring.datasource.password=123


# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public
app.tenants.migrate-on-startup=true

#Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path = /api-docs

#JWT
jwt.secret=this-is-a-very-long-secret-key-for-wheelgo-app-that-is-at-least-32-chars
jwt.expiration=86400000
